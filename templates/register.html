{% extends 'base.html' %}
{% block title %}Registro · Galsoft Helpdesk{% endblock %}
{% block content %}
<div class="row justify-content-center auth-panel">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='LogoGalsoft.png') }}" alt="Galsoft" class="auth-logo">
      <p class="text-muted mt-2 mb-0">Alta de usuario cliente</p>
    </div>
    <div class="card card-soft p-4">
      <h4 class="mb-3 text-center">Crear cuenta</h4>

      <form method="post">
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <p class="text-muted small">El registro crea cuentas de tipo cliente. Los roles agente y administrador los asigna un administrador.</p>

        <button class="btn btn-galsoft w-100">Crear cuenta</button>
      </form>

      <p class="mt-3 text-center mb-0">
        ¿Ya tienes cuenta?
        <a href="{{ url_for('login') }}">Iniciar sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
