{% extends 'base.html' %}
{% block title %}Registro · Galsoft Helpdesk{% endblock %}
{% block content %}
<div class="row justify-content-center auth-panel">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <h3>Recuperar contraseña</h3>
      <form method="POST">
      <label class="form-label">Introduce tu correo:</label>
      <input type="email" name="email" required class="form-control">
      <button class="btn btn-galsoft mt-3">Continuar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
