{% extends 'base.html' %}
{% block content %}

<div class="card card-soft p-4">
  <h4 class="mb-3">Gestionar ticket #{{ ticket.id }}</h4>
  <p class="text-muted">{{ ticket.titulo }}</p>

  <form method="post">
    <label class="form-label">Estado</label>
    <select name="estado" class="form-select mb-3">
      <option value="Abierto" {% if ticket.estado == 'Abierto' %}selected{% endif %}>Abierto</option>
      <option value="En proceso" {% if ticket.estado == 'En proceso' %}selected{% endif %}>En proceso</option>
      <option value="Cerrado" {% if ticket.estado == 'Cerrado' %}selected{% endif %}>Cerrado</option>
    </select>

    <label class="form-label">Prioridad</label>
    {% set p = (ticket.prioridad or 'media')|lower %}
    <select name="prioridad" class="form-select mb-3">
      <option value="baja" {% if p == 'baja' %}selected{% endif %}>Baja</option>
      <option value="media" {% if p == 'media' %}selected{% endif %}>Media</option>
      <option value="alta" {% if p == 'alta' %}selected{% endif %}>Alta</option>
    </select>
    <p class="small mb-3">
      Vista previa:
      {% if p == 'baja' %}<span class="prioridad-baja">baja</span>
      {% elif p == 'alta' %}<span class="prioridad-alta">alta</span>
      {% else %}<span class="prioridad-media">media</span>{% endif %}
    </p>

    <label class="form-label">Comentario</label>
    <textarea name="comentario" class="form-control" rows="3"
              placeholder="Describe el motivo del cambio de estado..."></textarea>

    <button class="btn btn-galsoft mt-3">Guardar</button>
  </form>
</div>

{% endblock %}
